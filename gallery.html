  <meta name="twitter:card" content="summary" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

</head>

<body>

  <div class="scanlines" aria-hidden="true"></div>
  <div class="cursor-dot" id="cursorDot" aria-hidden="true"></div>

  <!-- Lightbox: clicking anywhere (including the close button) closes it -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lightbox-close" aria-label="Close">✕</button>
    <img id="lightboxImg" src="" alt="" class="lightbox-img" />
  </div>

  <main class="card-wrapper">

    <a href="index.html" class="back-link">martin's page 🦊</a>

    <div class="card">
      <div class="card-topbar">
        <nav class="topbar-nav" aria-label="Main">
          <a href="projects.html" class="topbar-link">projects</a>
          <span class="topbar-sep" aria-hidden="true">·</span>
          <a href="artworks.html" class="topbar-link">artworks</a>
          <span class="topbar-sep" aria-hidden="true">·</span>
          <a href="gallery.html" class="topbar-link topbar-link-active" aria-current="page">gallery</a>
        </nav>
        <div class="topbar-dots" aria-hidden="true">
          <span class="dot dot-red"></span>
          <span class="dot dot-yellow"></span>
          <span class="dot dot-green"></span>
        </div>
      </div>

      <div class="page-content">
        <h1 class="page-title">Gallery<span class="exclaim">.</span></h1>
        <div class="dashed-divider"></div>

        <div id="photoCount" class="gallery-count" aria-live="polite"></div>

        <div id="photoGrid" class="art-grid gallery-grid">
          <div class="art-card skeleton-card" aria-hidden="true"></div>
          <div class="art-card skeleton-card" aria-hidden="true"></div>
          <div class="art-card skeleton-card" aria-hidden="true"></div>
          <div class="art-card skeleton-card" aria-hidden="true"></div>
          <div class="art-card skeleton-card" aria-hidden="true"></div>
          <div class="art-card skeleton-card" aria-hidden="true"></div>
        </div>

        <noscript><p class="load-error">Enable JavaScript to view the gallery.</p></noscript>
      </div>

      <p class="icon-credit">
        icon:
        <a href="https://www.flaticon.com/free-icons/fox" title="fox icons" target="_blank" rel="noopener noreferrer">
          amonrat rungreangfangsai / Flaticon
        </a>
      </p>

      <div class="card-footer">@foxfoxesfox</div>
    </div>
  </main>

  <script src="script.js"></script>
  <script>
    const FOLDER = 'assets/photos/';
    const lightbox = initLightbox(FOLDER);

    async function loadGallery() {
      const grid  = document.getElementById('photoGrid');
      const count = document.getElementById('photoCount');
      let photos;

      try {
        const res = await fetch(FOLDER + 'photos.json');
        if (!res.ok) throw new Error();
        photos = await res.json();
      } catch {
        grid.innerHTML = '<p class="load-error load-error-wide">No photos found. Add images to <code>assets/photos/</code> and update <code>photos.json</code>.</p>';
        return;
      }

      count.textContent = `${photos.length} photo${photos.length === 1 ? '' : 's'}`;

      grid.innerHTML = '';
      photos.forEach((photo, i) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'art-card gallery-card';
        card.setAttribute('aria-label', `View photo ${i + 1}`);
        card.innerHTML = `<img src="${FOLDER}${photo.file}" alt="${photo.alt || ''}" loading="lazy" class="art-img gallery-img" />`;
        card.addEventListener('click', () => lightbox.open(photos, i));
        grid.appendChild(card);
      });
    }

    loadGallery();
  </script>


</body>
</html>
