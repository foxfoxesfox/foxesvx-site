  <script>
    const FOLDER = 'assets/photos/';
    const lightbox = initLightbox(FOLDER);

    async function loadGallery() {
      const grid  = document.getElementById('photoGrid');
      const count = document.getElementById('photoCount');
      let photos;

      try {
        const res = await fetch(FOLDER + 'photos.json');
        if (!res.ok) throw new Error();
        photos = await res.json();
      } catch {
        photos = [];
      }

      if (!photos.length) {
        grid.outerHTML = '<p class="wrap empty">No photos yet. The fox is still out scouting.</p>';
        return;
      }

      count.textContent = `${photos.length} photo${photos.length === 1 ? '' : 's'}`;

      grid.innerHTML = '';
      photos.forEach((photo, i) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'tile';
        card.setAttribute('aria-label', `View photo ${i + 1}`);
        card.innerHTML = `<img src="${FOLDER}${photo.file}" alt="${photo.alt || ''}" loading="lazy" decoding="async" />`;
        card.addEventListener('click', () => lightbox.open(photos, i));
        grid.appendChild(card);
      });
    }

    loadGallery();
  </script>
