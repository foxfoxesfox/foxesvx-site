  <script>
    (async function () {
      const list = document.getElementById('toolList');
      const source = url => {
        const u = new URL(url);
        const parts = u.pathname.split('/').filter(Boolean);
        return u.hostname === 'github.com' ? parts.slice(0, 2).join('/') : u.hostname.replace(/^www\./, '');
      };

      try {
        const res = await fetch('assets/tools.json');
        if (!res.ok) throw new Error();
        const groups = await res.json();

        list.innerHTML = groups.map(group => `
          <section aria-label="${group.category}">
            <h2 class="group-title lettered">${group.category}</h2>
            <ul class="tool-list">
              ${group.tools.map(tool => `
                <li>
                  <a class="tool" href="${tool.url}" target="_blank" rel="noopener noreferrer">
                    <span class="tool-name">${tool.name}&nbsp;<span class="tool-arrow" aria-hidden="true">↗</span></span>
                    <span class="tool-src">${source(tool.url)}</span>
                    <span class="tool-desc">${tool.desc}</span>
                  </a>
                </li>
              `).join('')}
            </ul>
          </section>
        `).join('');
      } catch {
        list.innerHTML = '<p class="empty">Could not load the tools list.</p>';
      }
    })();
  </script>
