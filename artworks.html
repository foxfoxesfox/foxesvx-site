<head>

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Martin's page 🦊" />
  <meta property="og:title" content="Artworks — Martin" />
  <meta property="og:description" content="A collection of my artwork, both digital pieces and physical drawings and paintings." />
  <meta property="og:url" content="https://foxesvx.dev/artworks" />

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Artworks — Martin" />

  <link rel="icon" type="image/png" href="/assets/fox.png?v=2">
  <link rel="apple-touch-icon" href="/assets/fox.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="scanlines" aria-hidden="true"></div>
  <div class="cursor-dot" id="cursorDot" aria-hidden="true"></div>

  <!-- Lightbox: clicking anywhere (including the close button) closes it -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Artwork viewer">
    <button class="lightbox-close" aria-label="Close">✕</button>
    <img id="lightboxImg" src="" alt="" class="lightbox-img" />
    <div id="lightboxCaption" class="lightbox-caption"></div>
  </div>

  <main class="card-wrapper">

    <a href="index.html" class="back-link">martin's page 🦊</a>

    <div class="card">
      <div class="card-topbar">
        <nav class="topbar-nav" aria-label="Main">
          <a href="projects.html" class="topbar-link">projects</a>
          <span class="topbar-sep" aria-hidden="true">·</span>
          <a href="artworks.html" class="topbar-link topbar-link-active" aria-current="page">artworks</a>
          <span class="topbar-sep" aria-hidden="true">·</span>
          <a href="gallery.html" class="topbar-link">gallery</a>
        </nav>
        <div class="topbar-dots" aria-hidden="true">
          <span class="dot dot-red"></span>
          <span class="dot dot-yellow"></span>
          <span class="dot dot-green"></span>
        </div>
      </div>

      <div class="page-content">
        <h2 class="page-title">Artworks<span class="exclaim">.</span></h2>
        <div class="dashed-divider"></div>

        <!-- Digital -->
        <h3 class="section-label section-label-spaced">Digital</h3>
        <div id="digitalGrid" class="art-grid art-grid-digital">
          <div class="art-card skeleton-card" aria-hidden="true"></div>
        </div>

        <div class="dashed-divider"></div>

        <!-- Physical -->
        <h3 class="section-label section-label-spaced">Physical</h3>
        <div id="physicalGrid" class="art-grid">
          <div class="art-card skeleton-card" aria-hidden="true"></div>
          <div class="art-card skeleton-card" aria-hidden="true"></div>
          <div class="art-card skeleton-card" aria-hidden="true"></div>
          <div class="art-card skeleton-card" aria-hidden="true"></div>
        </div>

        <noscript><p class="load-error">Enable JavaScript to view the artworks.</p></noscript>
      </div>

      <p class="icon-credit">
        icon:
        <a href="https://www.flaticon.com/free-icons/fox" title="fox icons" target="_blank" rel="noopener noreferrer">
          amonrat rungreangfangsai / Flaticon
        </a>
      </p>

      <div class="card-footer">@foxfoxesfox</div>
    </div>
  </main>

  <script src="script.js"></script>
  <script>
    const FOLDER = 'assets/artworks/';
    const lightbox = initLightbox(FOLDER);
    let items = []; // digital first, then physical (matches grid click indexes)

    function buildGrid(gridEl, list, startIndex) {
      gridEl.innerHTML = '';
      list.forEach((item, i) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'art-card';
        card.setAttribute('aria-label', 'View ' + (item.title || 'artwork'));
        card.innerHTML = `
          <img src="${FOLDER}${item.file}" alt="${item.title || ''}" loading="lazy" class="art-img" />
          <div class="art-overlay">
            <div class="art-title">${item.title || ''}</div>
            ${item.sub ? `<div class="art-sub">${item.sub}</div>` : ''}
          </div>
        `;
        card.addEventListener('click', () => lightbox.open(items, startIndex + i));
        gridEl.appendChild(card);
      });
    }

    async function loadArtworks() {
      const digitalGrid  = document.getElementById('digitalGrid');
      const physicalGrid = document.getElementById('physicalGrid');

      try {
        const res = await fetch(FOLDER + 'artworks.json');
        if (!res.ok) throw new Error('manifest not found');
        const artworks = await res.json();

        const digital  = artworks.filter(a => a.category === 'digital');
        const physical = artworks.filter(a => a.category === 'physical');

        items = [...digital, ...physical];
        buildGrid(digitalGrid, digital, 0);
        buildGrid(physicalGrid, physical, digital.length);
      } catch {
        digitalGrid.innerHTML = '<p class="load-error">Could not load artworks.json</p>';
        physicalGrid.innerHTML = '';
      }
    }

    loadArtworks();
  </script>


</body>
</html>
